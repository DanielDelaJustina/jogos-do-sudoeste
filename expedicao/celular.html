<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1720">
  <title>Expedição Sudoeste · Meu tabuleiro</title>
  <link rel="stylesheet" href="../css/estilo.css">
  <style>
    .rodada { display: flex; gap: 12px; align-items: center; margin: 10px 0; }
    .rodada canvas { width: 96px; height: 96px; border-radius: 10px; flex: none; }
    .rodada .bts { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .rodada .bts .botao { margin: 0; padding: 10px; font-size: 16px; }
    #tab { width: 100%; display: block; touch-action: manipulation; border-radius: 12px; margin-top: 8px; }
    .linha-bts { display: flex; gap: 8px; }
    .linha-bts .botao { flex: 1; }
    .placar { display: flex; justify-content: space-between; font-weight: 700; margin-top: 8px; }
  </style>
</head>
<body class="cel">
  <header><b id="titulo">Expedição Sudoeste</b><span id="status">conectando...</span></header>
  <main id="tela"></main>
  <div id="erro" class="erro hidden"></div>

  <script src="../js/firebase.js"></script>
  <script src="../js/sala-regras.js"></script>
  <script src="../js/sala.js"></script>
  <script src="regras.js"></script>
  <script src="desenho.js"></script>
  <script src="celular.js"></script>
</body>
</html>
